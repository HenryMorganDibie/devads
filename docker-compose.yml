version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devads
      POSTGRES_PASSWORD: devads
      POSTGRES_DB: devads
    ports:
      - "5442:5432"
    volumes:
      - devads-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devads"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: devads-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devads
      MINIO_ROOT_PASSWORD: devads123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - devads-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devads-postgres-data:
  devads-minio-data:
